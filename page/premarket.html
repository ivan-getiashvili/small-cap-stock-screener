<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400..700&family=JetBrains+Mono:wght@400..700&display=swap">
<style>
  :root{
    --bg:#0a0d12; --panel:#11151c; --panel2:#161b24; --line:#212834; --line2:#2c3544;
    --ink:#e8ecf4; --dim:#98a3b7; --faint:#6b768c;
    --go:#3fd07f; --go-bg:rgba(63,208,127,.10); --warn:#f0b849; --no:#5b6474; --hot:#ff6b6b;
    --blue:#3987e5; --red:#e66767;
    --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
    --sans:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 var(--sans);-webkit-font-smoothing:antialiased;
       font-feature-settings:"tnum" 1,"cv11" 1}
  .wrap{max-width:920px;margin:0 auto;padding:22px 18px 60px}
  a{color:#7fb2ff}
  button{font-family:inherit}

  /* ---- Header + toolbar ---------------------------------------------------- */
  header.top{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:flex-end;justify-content:space-between;
             padding-bottom:16px;border-bottom:1px solid var(--line)}
  h1{margin:0;font-size:22px;font-weight:650;letter-spacing:-.02em}
  .sub{color:var(--faint);font-size:13px;margin-top:4px}
  .status{text-align:right;font:12px/1.75 var(--mono);color:var(--dim)}
  .pill{display:inline-block;padding:3px 10px;border-radius:99px;font:600 11px/1.6 var(--mono);
        text-transform:uppercase;letter-spacing:.07em;vertical-align:middle}
  .pill.live{background:var(--go-bg);color:var(--go)}
  .pill.shut{background:#1c222c;color:var(--faint)}
  #age{color:var(--faint)}

  nav.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:12px 0 10px}
  .tog{appearance:none;border:1px solid var(--line2);background:var(--panel);color:var(--dim);
       font:500 12.5px/1 var(--sans);padding:8px 12px;border-radius:99px;cursor:pointer;
       display:inline-flex;align-items:center;gap:7px;transition:border-color .12s,color .12s,background .12s}
  .tog:hover{color:var(--ink);border-color:#3d495c}
  .tog[aria-expanded="true"]{background:var(--panel2);color:var(--ink);border-color:#3d495c}
  .tog .chev{display:inline-block;width:8px;height:8px;border-right:1.5px solid currentColor;border-bottom:1.5px solid currentColor;
             transform:rotate(45deg) translateY(-2px);transition:transform .15s;opacity:.7}
  .tog[aria-expanded="true"] .chev{transform:rotate(225deg) translateY(-2px)}
  .tog .n{font:600 11px/1 var(--mono);color:var(--faint);background:#1c222c;padding:3px 6px;border-radius:99px}
  .tog.on{color:var(--go);border-color:rgba(63,208,127,.35)}
  .tog.blocked{color:var(--warn)}
  .bar .spacer{flex:1}

  .panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin:2px 0 14px}
  #criteria{margin-top:36px}
  .hist-sec{margin-top:28px}
  .sec-h{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;margin:0 0 10px}
  .sec-h .hint{color:var(--faint);font-size:12.5px}
  .panel h2{margin:0 0 4px;font-size:14px;font-weight:650;letter-spacing:.01em;color:var(--ink);text-transform:none}
  .panel .lede{color:var(--dim);font-size:13px;margin:0 0 12px}
  .crit{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin:12px 0 6px}
  .crit div{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
  .crit b{display:block;font:600 14px/1.35 var(--mono);color:var(--go)}
  .crit small{color:var(--faint);font-size:11px;text-transform:uppercase;letter-spacing:.05em}
  .panel p{margin:10px 0 0;color:var(--dim);font-size:13px;line-height:1.6}
  .panel p b{color:var(--ink);font-weight:600}

  /* ---- Banner + lists ------------------------------------------------------ */
  .banner{border-radius:12px;padding:14px 16px;margin:6px 0 18px;font-size:13.5px;line-height:1.6}
  .banner.wait{background:rgba(240,184,73,.08);border:1px solid rgba(240,184,73,.25);color:#e8c37a}
  .banner.none{background:var(--panel);border:1px solid var(--line);color:var(--dim)}
  .banner.demo{background:rgba(99,162,255,.08);border:1px solid rgba(99,162,255,.3);color:#a9c9ff}

  h2{font-size:12px;text-transform:uppercase;letter-spacing:.09em;color:var(--dim);margin:26px 0 12px;font-weight:650}
  h2 em{font-style:normal;color:var(--faint);text-transform:none;letter-spacing:0;font-weight:400}

  .primary{margin:8px 0 6px}
  .primary h2{font-size:15px;color:var(--go);letter-spacing:.02em;text-transform:none;margin:10px 0 3px}
  .primary .lede{color:var(--dim);font-size:13px;margin-bottom:14px}
  .rank{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;
        border-radius:7px;background:var(--go);color:#08130c;font:700 12.5px/1 var(--mono);margin-right:9px;vertical-align:3px}

  .divider{display:flex;align-items:center;gap:14px;margin:36px 0 16px}
  .divider::before,.divider::after{content:'';flex:1;height:1px;background:var(--line)}
  .divider span{color:var(--faint);font:11px/1 var(--mono);text-transform:uppercase;letter-spacing:.12em;white-space:nowrap}

  .secondary{opacity:.75}
  .secondary:hover{opacity:1}
  .secondary h2{color:var(--faint);margin-top:0}
  .mini{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:12px;align-items:center;
        padding:10px 14px;border:1px solid var(--line);border-radius:10px;background:var(--panel);margin-bottom:7px}
  .mini .mt{font:650 14.5px/1.2 var(--mono)}
  .mini .mn{color:var(--faint);font-size:11.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .mini .mc{font:600 14px/1.2 var(--mono);color:var(--go)}
  .mini .mf{font:11.5px/1.35 var(--mono);color:var(--dim);text-align:right}
  .mini .miss{display:block;color:var(--warn);font-size:10.5px}

  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px 20px;margin-bottom:12px}
  .card.top{border-color:rgba(63,208,127,.35);box-shadow:0 0 0 1px rgba(63,208,127,.08) inset,0 12px 40px -24px rgba(63,208,127,.35)}
  .row1{display:flex;flex-wrap:wrap;gap:12px;align-items:baseline;justify-content:space-between}
  .tick{font:650 21px/1.2 var(--mono);letter-spacing:.01em}
  .co{color:var(--faint);font-size:12.5px;max-width:360px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .biz{color:var(--dim);font-size:12px;margin-top:2px}
  .chg{font:650 22px/1.2 var(--mono);color:var(--go)}
  .chg.big{color:var(--hot)}
  .px{font:12.5px/1.2 var(--mono);color:var(--dim)}
  .nums{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:1px;background:var(--line);
        border:1px solid var(--line);border-radius:10px;overflow:hidden;margin:13px 0}
  .nums div{background:var(--panel2);padding:9px 11px}
  .nums b{display:block;font:600 15px/1.3 var(--mono)}
  .nums small{color:var(--faint);font-size:10.5px;text-transform:uppercase;letter-spacing:.05em}
  .nums b.go{color:var(--go)} .nums b.hot{color:var(--hot)} .nums b.warn{color:var(--warn)}
  .why{margin:11px 0 0;font-size:13px;color:var(--ink);background:rgba(63,208,127,.06);
       border:1px solid rgba(63,208,127,.18);border-radius:10px;padding:9px 12px}
  .why b{font-family:var(--mono);font-weight:600}
  .checks{display:flex;flex-wrap:wrap;gap:6px;margin-top:11px}
  .chk{font:11.5px/1.7 var(--sans);padding:2px 9px;border-radius:6px;background:#1c222c;color:var(--no)}
  .chk.ok{background:var(--go-bg);color:var(--go)}
  .ext{margin-top:9px;font-size:12.5px;line-height:1.55;color:#e8c37a;
       background:rgba(240,184,73,.07);border:1px solid rgba(240,184,73,.25);border-radius:10px;padding:9px 12px}
  .ext b{color:var(--warn)}
  .cat{margin-top:11px;font-size:13px;color:var(--dim);border-left:2px solid var(--line2);padding-left:11px}
  .cat b{color:var(--ink)}

  footer{margin-top:40px;padding-top:16px;border-top:1px solid var(--line);font-size:12px;line-height:1.7;color:var(--faint)}
  footer b{color:var(--dim)}

  /* ---- The build-time copy of the content (lib/prerender.ts) ------------------
     What a reader without JavaScript gets, and what is on screen for the instant
     before the script redraws it. Plain, complete, legible. */
  .static h2{font-size:14px;color:var(--ink);text-transform:none;letter-spacing:.01em;margin:22px 0 8px}
  .static-stock{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 16px;margin-bottom:10px}
  .static-stock h3{margin:0 0 2px;font:650 15px/1.3 var(--mono)}
  .static-stock p{margin:0 0 6px;color:var(--dim);font-size:12.5px}
  .static-stock ul{margin:0;padding-left:18px;color:var(--dim);font-size:13px;line-height:1.6}
  .static-stock li b{color:var(--ink);font-weight:600}
  .static-status{color:var(--dim);font-size:13px;margin:6px 0 12px}
  .static-scroll{overflow-x:auto}
  .static-table{width:100%;border-collapse:collapse;font-size:12.5px}
  .static-table th,.static-table td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
  .static-table td:nth-child(3){white-space:normal;color:var(--faint)}
  .static-table th{color:var(--faint);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.05em}

  /* ---- Track record (compact) ----------------------------------------------
     One number per name: the run from the flag price to the high of the day.
     Marks use the validated diverging pair (blue/red, CVD dE 19.2); the signed
     number sits next to every bar, so colour is never the only channel. */
  .tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:var(--line);
         border:1px solid var(--line);border-radius:10px;overflow:hidden;margin:12px 0 14px}
  .tiles div{background:var(--panel2);padding:12px 14px}
  .tiles b{display:block;font:600 24px/1.2 var(--mono)}
  .tiles small{color:var(--faint);font-size:11.5px}
  .keyrow{display:flex;flex-wrap:wrap;gap:14px;align-items:center;color:var(--faint);font-size:11.5px;margin:0 0 4px}
  .keyrow i{display:inline-block;vertical-align:middle;margin-right:6px;width:14px;height:8px;border-radius:2px}
  .tday-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font:12px/1.4 var(--mono);color:var(--faint);
          padding:14px 2px 4px;border-bottom:1px solid var(--line)}
  .tday-h b{color:var(--dim);font-weight:600}
  .src{padding:1px 7px;border-radius:99px;font:10.5px/1.6 var(--mono);text-transform:uppercase;letter-spacing:.06em;
       background:#1c222c;color:var(--dim);margin-left:6px}
  .trow{display:grid;grid-template-columns:76px minmax(0,1fr) minmax(140px,1.6fr) 64px;gap:10px;align-items:center;
        padding:6px 2px;border-bottom:1px solid var(--line);font-size:12.5px}
  .trow:last-child{border-bottom:0}
  .trow .tk{font:650 13px/1.2 var(--mono)}
  .trow.watch .tk{color:var(--dim)}
  .trow .nm{color:var(--faint);font-size:11.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .run{position:relative;height:14px}
  .run .zero{position:absolute;top:0;bottom:0;width:1px;background:#3a4252}
  .run .up{position:absolute;top:3px;height:8px;background:var(--blue);border-radius:0 4px 4px 0}
  .run .dn{position:absolute;top:3px;height:8px;background:var(--red);border-radius:4px 0 0 4px}
  .run .cap{position:absolute;top:0;font:10px/14px var(--mono);color:var(--faint)}
  .trow .v{font:600 12.5px/1.2 var(--mono);text-align:right;font-variant-numeric:tabular-nums}
  .trow .v.pos{color:var(--blue)} .trow .v.neg{color:var(--red)}
  .trow .pend{grid-column:3/-1;color:var(--faint);font-size:11.5px;text-align:right}
  @media(max-width:640px){
    .status{text-align:left}
    .tday-h{flex-wrap:wrap;gap:2px 10px}
    .tday-h b{white-space:nowrap}
    /* Two lines per name: ticker · company · run on the first, the bar on the second. */
    .trow{grid-template-columns:72px minmax(0,1fr) 60px;row-gap:5px}
    .trow .v{grid-column:3;grid-row:1}
    .trow .run{grid-column:1/-1;grid-row:2}
    .trow .pend{grid-column:1/-1;grid-row:2;text-align:left}
  }
</style>

<div class="wrap">
  <header class="top">
    <div>
      <h1>Pre-Market Shortlist</h1>
      <div class="sub">Small-cap momentum candidates, screened before the bell.</div>
    </div>
    <div class="status" id="status"></div>
  </header>

  <nav class="bar" aria-label="Alerts">
    <button class="tog" id="alerts" hidden></button>
  </nav>

  <div id="banner"></div>
  <div id="shortlist"></div>
  <div id="watchlist"></div>

  <section id="criteria" class="panel"></section>

  <section class="hist-sec" id="hist-sec">
    <div class="sec-h">
      <button class="tog" id="tog-history" aria-expanded="false" aria-controls="history">Historical performance <span class="n" id="history-n" hidden></span><span class="chev"></span></button>
      <span class="hint" id="history-hint"></span>
    </div>
    <div id="history" class="panel" hidden></div>
  </section>

  <footer id="foot"></footer>
</div>

<script>
const D = /*__PREMARKET__*/null;
const H = /*__HISTORY__*/null;

const f = {
  usd: n => '$' + Number(n).toFixed(2),
  pct: n => (n >= 0 ? '+' : '') + Number(n).toFixed(1) + '%',
  sh:  n => n == null ? '—' : n >= 1e9 ? (n/1e9).toFixed(2)+'B' : n >= 1e6 ? (n/1e6).toFixed(1)+'M'
        : n >= 1e3 ? (n/1e3).toFixed(0)+'K' : String(n),
  mult: n => n == null ? '—' : Number(n).toFixed(1) + '×',
  time: iso => new Date(iso).toLocaleString(undefined, {dateStyle:'medium', timeStyle:'short'}),
};
// Company names, business lines and headlines come from outside sources.
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function mini(r){
  const failed = (r.checks||[]).filter(c => !c.ok).map(c => c.name);
  return `<div class="mini">
    <span class="mt">${esc(r.symbol)}</span>
    <span class="mn">${esc(r.legalName||r.name||'')}${r.business? ' · '+esc(r.business) : ''}</span>
    <span class="mc">${f.pct(r.preMarketChangePct)}</span>
    <span class="mf">${f.usd(r.preMarketPrice)} · ${f.sh(r.preMarketVolume)} sh
      ${failed.length? `<span class="miss">missing: ${esc(failed.join(', '))}</span>`:''}</span>
  </div>`;
}

function card(r, top, rank){
  const nums = [
    [f.pct(r.preMarketChangePct), 'pre-market move', r.preMarketChangePct >= 20 ? 'hot' : 'go'],
    [f.mult(r.relVolume), 'rel volume', (r.relVolume||0) >= 5 ? 'go' : ''],
    [f.sh(r.preMarketVolume), 'pre-mkt shares', (r.preMarketVolume||0) >= 150000 ? 'go' : ''],
    [r.preMarketDollarVolume ? '$' + f.sh(r.preMarketDollarVolume) : '—', 'pre-mkt $ traded', ''],
    [r.float ? f.sh(r.float.shares) : '—', 'float', r.float && r.float.shares < 10e6 ? 'go' : ''],
    [r.floatPctOfShares != null ? r.floatPctOfShares.toFixed(0) + '%' : '—', 'float / shares out', ''],
    [f.mult(r.floatRotation), 'float rotation', (r.floatRotation||0) >= 1 ? 'go' : ''],
    [r.marketCap ? '$' + f.sh(r.marketCap) : '—', 'market cap', ''],
    [r.daysUp != null ? 'day ' + (r.daysUp + 1) : '—', 'of the run', r.extended ? 'warn' : 'go'],
  ].map(([v,l,c]) => `<div><b class="${c||''}">${v}</b><small>${l}</small></div>`).join('');

  // The one-line case for looking at this stock at all.
  const why = [];
  if (r.relVolume != null)
    why.push(`trading <b>${f.mult(r.relVolume)}</b> a normal full day's volume before the open`);
  if (r.floatRotation != null && r.floatRotation >= 0.5)
    why.push(`already turned over <b>${f.mult(r.floatRotation)}</b> its float`);
  else if (r.float)
    why.push(`only <b>${f.sh(r.float.shares)}</b> shares available to trade`);
  if (r.bestPriorSpikePct != null && r.bestPriorSpikePct >= 20)
    why.push(`has run <b>+${r.bestPriorSpikePct.toFixed(0)}%</b> in a day before`);
  if (r.preMarketHigh && r.preMarketLow)
    why.push(`pre-market range <b>${f.usd(r.preMarketLow)}–${f.usd(r.preMarketHigh)}</b>`);

  const name = esc(r.legalName||r.name||'');
  return `<div class="card ${top?'top':''}">
    <div class="row1">
      <div>
        ${rank ? `<span class="rank">${rank}</span>` : ''}<span class="tick">${esc(r.symbol)}</span>
        <div class="co" title="${name}">${name}</div>
        ${r.business ? `<div class="biz">${esc(r.business)}</div>` : ''}
      </div>
      <div style="text-align:right">
        <div class="chg ${r.preMarketChangePct>=50?'big':''}">${f.pct(r.preMarketChangePct)}</div>
        <div class="px">${f.usd(r.preMarketPrice)} &nbsp;<span style="color:var(--faint)">prev ${r.prevClose?f.usd(r.prevClose):'—'}</span></div>
      </div>
    </div>

    ${why.length ? `<div class="why">Why it is here: ${why.join(' · ')}.</div>` : ''}
    ${r.extended ? `<div class="ext"><b>Already extended.</b>
      ${r.daysUp >= 2 ? `Day ${r.daysUp + 1} of an up-run` : 'Has run hard into today'}${
        r.priorRunPct != null ? `, up ${r.priorRunPct >= 0 ? '+' : ''}${r.priorRunPct.toFixed(0)}% over the last few sessions before this morning` : ''
      }. Multi-day runners are usually squeezes that have already happened — the fresh day-one move is the one worth having.</div>` : ''}

    <div class="nums">${nums}</div>

    <div class="checks">${r.checks.map(c =>
      `<span class="chk ${c.ok?'ok':''}">${c.ok?'✓':'✕'} ${esc(c.name)} · ${esc(c.detail)}</span>`).join('')}</div>

    ${r.catalyst && r.catalyst.found
      ? `<div class="cat">
           <b>${esc(r.catalyst.subject || (r.catalyst.kind === '8-K' ? 'SEC filing' : 'News'))}</b>
           <span style="color:var(--faint)">· ${r.catalyst.kind === '8-K' ? 'SEC 8-K' : 'headline'} ${esc(r.catalyst.date||'')}</span>
           ${r.catalyst.headline && r.catalyst.headline !== r.catalyst.subject
              ? `<div style="margin-top:3px">${esc(r.catalyst.headline)}</div>` : ''}
         </div>`
      : `<div class="cat">No catalyst found — the move has no visible reason behind it.</div>`}
    ${r.float && r.float.basis !== 'sec-public-float'
      ? `<div class="cat" style="border-color:rgba(240,184,73,.45)">Float shown is <b>shares outstanding</b>, an upper bound — the true tradable float is smaller, so rotation is understated.</div>`
      : r.float ? `<div class="cat" style="color:var(--faint)">Float filed with the SEC ${esc(r.float.asOf)}. Annual figure — check it before sizing.</div>` : ''}
  </div>`;
}

function lists(){
  document.getElementById('shortlist').innerHTML = D.shortlist.length
    ? `<div class="primary"><h2>Trade candidates — ${D.shortlist.length} name${D.shortlist.length>1?'s':''}</h2>
       <div class="lede">These met every criterion. This is the list; everything below the line is context.</div></div>`
      + D.shortlist.map((r,i) => card(r, true, i+1)).join('')
    : '';
  document.getElementById('watchlist').innerHTML = D.watchlist.length
    ? `<div class="divider"><span>below the line — not trade candidates</span></div>
       <div class="secondary"><h2>Watchlist <em>— four of five, the missing one is named</em></h2>`
      + D.watchlist.map(r => mini(r)).join('') + `</div>`
    : '';
}

function render(){
  if (!D){ document.getElementById('banner').innerHTML =
    '<div class="banner none">No scan has run yet.</div>'; return; }

  const open = /pre[\s-]?market/i.test(D.marketStatus||'');
  document.getElementById('status').innerHTML =
    `<span class="pill ${open?'live':'shut'}">${esc(D.marketStatus||'unknown')}</span> <span id="age"></span><br>` +
    `scanned ${f.time(D.generatedAt)}<br>${D.universeChecked.toLocaleString()} symbols` +
    (D.investigated ? ` · ${D.investigated.toLocaleString()} investigated` : '') +
    (D.fetch && D.fetch.requested ? ` · ${D.fetch.answerRatePct.toFixed(0)}% of quotes answered` : '');

  criteria();
  const b = document.getElementById('banner');
  if (D.isDemo){
    b.innerHTML =
      `<div class="banner demo"><b>This is a replay, not today's list.</b>
       Every number below is the real pre-market state of a real stock on
       <b>${esc(D.demoDate)}</b>, frozen at <b>${esc(D.snapshotAtEt)} ET</b> — the moment the live scan runs.
       Nothing here is invented. It exists so you can see the shape of the product before a live
       session fills it in. Catalysts are not re-checked in a replay.</div>`;
    lists(); foot(); return;
  }
  // A broken feed looks exactly like a quiet market — an empty list either way.
  // Say which one it is rather than let silence imply "nothing qualified".
  if (D.fetch && !D.fetch.reliable){
    b.innerHTML = `<div class="banner wait"><b>This scan is unreliable.</b>
      Only ${D.fetch.answerRatePct.toFixed(0)}% of quote requests answered
      (${D.fetch.answered.toLocaleString()} of ${D.fetch.requested.toLocaleString()}),
      so an empty shortlist below may mean the data feed failed rather than that nothing qualified.
      Do not read this as "no opportunities today".</div>`;
  } else if (D.liveQuotes === 0){
    b.innerHTML = `<div class="banner wait"><b>No live pre-market quotes.</b>
      Nasdaq reports the market as “${esc(D.marketStatus||'unknown')}”, so there are no pre-market prices to read.
      This page fills in once the pre-market session is running — it opens at 4:00 AM ET and this scan is
      meant to run around 8:45. Prices below the fold, if any, are from the previous session
      (${esc(D.prevSession||'—')}).</div>`;
  } else if (!D.shortlist.length){
    b.innerHTML = `<div class="banner none"><b>Nothing cleared all five criteria today.</b>
      ${D.liveQuotes.toLocaleString()} stocks had live pre-market prices. That is a normal outcome —
      a full scan usually leaves fewer than ten names, and some mornings none at all.
      Trading nothing is a position.</div>`;
  } else { b.innerHTML = ''; }
  lists();
  foot();
}

/** The five criteria and the reading rules, in the collapsible panel at the top. */
function criteria(){
  const g = D.gate;
  document.getElementById('criteria').innerHTML = `
    <h2>How it screens</h2>
    <div class="lede">Five criteria, all of which must pass to reach the shortlist. Four of five puts a name on the watchlist, with the missing one named.</div>
    <div class="crit">
      <div><b>≥ ${g.minPreMarketChangePct}%</b><small>up pre-market vs previous close</small></div>
      <div><b>≥ ${(g.minPreMarketVolume/1000)}k shares</b><small>pre-market volume</small></div>
      <div><b>News catalyst</b><small>a filing or release behind the move</small></div>
      <div><b>$${g.priceMin} – $${g.priceMax}</b><small>price</small></div>
      <div><b>&lt; ${g.floatIdeal/1e6}M shares</b><small>float</small></div>
    </div>
    <p><b>Quality.</b> Float under ${g.floatStretch/1e6}M with pre-market volume over ${g.goodPreMarketVolume/1000}k is high quality; volume under ${g.minPreMarketVolume/1000}k is low. Percent gainers rank first, then catalyst and float, so the list ends with a handful of names rather than twenty.</p>
    <p><b>Fresh moves only.</b> The percentage is this session against the previous close. A name that has already climbed for several sessions is marked <b>extended</b>: a stock up 100% in one morning on new information is the setup; one up 100% over three sessions is usually a squeeze that has already happened.</p>
    <p><b>What this is not.</b> It finds candidates; it decides nothing. Entry, size and stop are yours. Float is the weakest number here — the SEC files it once a year and small caps dilute constantly — so anything marked estimated should be checked before sizing a position.</p>`;
}

function foot(){
  document.getElementById('foot').innerHTML = `
    Sources: Nasdaq public quote and screener endpoints; SEC EDGAR for float, share count and 8-K filings.
    Data may be delayed. <b>Not investment advice.</b> A candidate list, not a trading system — the historical performance below shows what these names actually do.`;
}

/** A panel that opens on its button and remembers the choice on this device. */
function panel(btnId, panelId, key){
  const b = document.getElementById(btnId), p = document.getElementById(panelId);
  const set = open => { p.hidden = !open; b.setAttribute('aria-expanded', String(open)); try { localStorage.setItem(key, open ? '1' : '0'); } catch {} };
  b.addEventListener('click', () => set(p.hidden));
  let saved = null; try { saved = localStorage.getItem(key); } catch {}
  set(saved === '1');
}

/**
 * Desktop push, straight from the page — no app, no account, no key.
 *
 * The browser's own Notification API fires a real OS notification. The one
 * limitation is honest and unavoidable: it needs this page open in a tab,
 * because a static site has no server to push from. Keep it pinned during
 * pre-market and it behaves like any other alerting app.
 *
 * It only fires for names it has not already told you about — the page reloads
 * every three minutes, and re-announcing the same three tickers twenty times a
 * morning would be worse than silence.
 */
(function desktopPush(){
  if (!('Notification' in window) || !D || D.isDemo) return;

  const KEY = 'scs-announced';
  const readSeen = () => { try { return JSON.parse(localStorage.getItem(KEY) || '{}'); } catch { return {}; } };
  const writeSeen = (v) => { try { localStorage.setItem(KEY, JSON.stringify(v)); } catch {} };

  function announce(){
    if (Notification.permission !== 'granted') return;
    const today = (D.prevSession || new Date().toISOString().slice(0,10));
    const seen = readSeen();
    const already = seen.date === today ? (seen.symbols || []) : [];
    const fresh = (D.shortlist || []).filter(r => !already.includes(r.symbol));
    if (!fresh.length) return;

    const line = fresh.map(r =>
      `${r.symbol}  ${r.preMarketChangePct >= 0 ? '+' : ''}${r.preMarketChangePct.toFixed(0)}%` +
      (r.relVolume ? `  ${r.relVolume.toFixed(1)}x vol` : '')).join('\n');
    const n = new Notification(
      fresh.length === 1 ? `${fresh[0].symbol} cleared all five` : `${fresh.length} on the shortlist`,
      { body: line, tag: 'scs-shortlist', requireInteraction: true },
    );
    n.onclick = () => { window.focus(); n.close(); };
    writeSeen({ date: today, symbols: [...already, ...fresh.map(r => r.symbol)] });
  }

  // A small, honest control in the toolbar rather than an unprompted permission popup.
  const btn = document.getElementById('alerts');
  btn.hidden = false;
  function paint(){
    btn.classList.remove('on', 'blocked');
    if (Notification.permission === 'granted'){
      btn.classList.add('on'); btn.textContent = '✓ Desktop alerts on'; btn.title = 'Keep this tab open during pre-market.';
    } else if (Notification.permission === 'denied'){
      btn.classList.add('blocked'); btn.textContent = 'Alerts blocked'; btn.title = 'Allow notifications for this site in your browser settings.';
    } else {
      btn.textContent = 'Turn on desktop alerts'; btn.title = 'No app, no signup — a browser notification when a name clears all five.';
    }
  }
  btn.onclick = () => {
    if (Notification.permission === 'default')
      Notification.requestPermission().then(() => { paint(); announce(); });
  };
  paint();
  announce();
})();

/**
 * Track record: how far every flagged name ran from the price the list showed
 * to the high of that session. One number per name; losers shown like winners.
 *
 * Built with createElement/textContent throughout: company names come from
 * outside sources and must never be parsed as HTML.
 */
function renderHistory(){
  const mount = document.getElementById('history');
  const sec = document.getElementById('hist-sec');
  if (!mount || !H || !H.days || (D && D.isDemo)){ sec.hidden = true; return; }
  const days = Object.values(H.days).filter(d => d.names && d.names.length)
    .sort((a, b) => b.date.localeCompare(a.date));
  if (!days.length){ sec.hidden = true; return; }

  const el = (tag, cls, text) => { const n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; };
  const sgn = v => (v >= 0 ? '+' : '−') + Math.abs(v).toFixed(Math.abs(v) >= 100 ? 0 : 1) + '%';
  const med = a => { const s = [...a].sort((x, y) => x - y), m = s.length >> 1; return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2; };
  const avg = a => a.reduce((x, y) => x + y, 0) / a.length;
  const dayLabel = iso => new Date(iso + 'T12:00:00Z').toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric', timeZone: 'UTC' });

  // Measured from the pre-market price the list showed at the time — the
  // price a reader could have acted on — never from the open.
  const scored = n => n.performance && n.preMarketPrice > 0;
  const run = n => (n.performance.high / n.preMarketPrice - 1) * 100;
  const allScored = days.flatMap(d => d.names).filter(scored);
  const runs = allScored.map(run);
  const n = document.getElementById('history-n');
  n.textContent = String(allScored.length); n.hidden = !allScored.length;

  // A shared scale for every bar, set by where most rows sit (90th percentile),
  // not by the single most extreme one; anything beyond runs to the edge with
  // an arrow and its exact value stays in the number.
  const q = (arr, p) => { if (!arr.length) return 0; const s = [...arr].sort((a, b) => a - b); return s[Math.min(s.length - 1, Math.floor(p * (s.length - 1)))]; };
  const maxUp = Math.max(20, Math.ceil(q(runs, 0.9) / 5) * 5);
  const maxDn = Math.max(10, Math.ceil(q(runs.map(v => Math.max(0, -v)), 0.9) / 5) * 5);
  const span = maxUp + maxDn;
  const pos = v => ((Math.max(-maxDn, Math.min(maxUp, v)) + maxDn) / span) * 100;

  mount.replaceChildren();
  mount.appendChild(el('div', 'lede', 'How far every flagged name ran from the price the list showed to the high of that session. Scored after the close; nothing is filtered out.'));
  const hint = document.getElementById('history-hint');
  if (hint && runs.length) hint.textContent = `${allScored.length} names over ${new Set(allScored.map(x => x.firstSeenAt.slice(0,10))).size} sessions · median run to the high ${sgn(med(runs))}`;

  if (runs.length){
    const tiles = el('div', 'tiles');
    const tile = (value, label) => { const t = el('div'); t.appendChild(el('b', null, value)); t.appendChild(el('small', null, label)); tiles.appendChild(t); };
    tile(String(allScored.length), `flagged names scored, over ${new Set(allScored.map(x => x.firstSeenAt.slice(0,10))).size} sessions`);
    tile(sgn(avg(runs)), 'average run from the flag price to the high of the day');
    tile(sgn(med(runs)), 'median run from the flag price to the high of the day');
    mount.appendChild(tiles);
    const key = el('div', 'keyrow');
    const k = (color, label) => { const s = el('span'); const i = el('i'); i.style.background = color; s.appendChild(i); s.appendChild(document.createTextNode(label)); key.appendChild(s); };
    k('#3987e5', 'ran above the flag price'); k('#e66767', 'never got back above it');
    key.appendChild(el('span', null, `scale −${maxDn}% to +${maxUp}%`));
    mount.appendChild(key);
  }

  for (const day of days){
    const head = el('div', 'tday-h');
    head.appendChild(el('b', null, dayLabel(day.date)));
    const nc = day.names.filter(x => x.list === 'shortlist').length, nw = day.names.filter(x => x.list === 'watchlist').length;
    const meta = el('span', null, `${nc} candidate${nc === 1 ? '' : 's'} · ${nw} watchlist`);
    meta.appendChild(el('span', 'src', day.source === 'replay' ? 'replay' : 'live'));
    head.appendChild(meta);
    mount.appendChild(head);

    const ordered = [...day.names].sort((a, b) =>
      (a.list === b.list ? 0 : a.list === 'shortlist' ? -1 : 1) || b.preMarketChangePct - a.preMarketChangePct);
    for (const x of ordered){
      const row = el('div', 'trow' + (x.list === 'watchlist' ? ' watch' : ''));
      row.appendChild(el('div', 'tk', x.symbol));
      row.appendChild(el('div', 'nm', [x.legalName, x.business].filter(Boolean).join(' · ')));
      if (scored(x)){
        const v = run(x);
        const bar = el('div', 'run');
        bar.setAttribute('role', 'img');
        bar.setAttribute('aria-label', `${x.symbol}: high of the day ${sgn(v)} from the price shown when flagged, $${x.preMarketPrice.toFixed(2)}`);
        bar.title = `flagged at $${x.preMarketPrice.toFixed(2)} · high $${x.performance.high.toFixed(2)}`;
        const z = pos(0);
        const zero = el('div', 'zero'); zero.style.left = z + '%'; bar.appendChild(zero);
        if (v >= 0){ const up = el('div', 'up'); up.style.left = `calc(${z}% + 1px)`; up.style.width = `max(2px, calc(${pos(v) - z}% - 1px))`; bar.appendChild(up); }
        else { const dn = el('div', 'dn'); const l = pos(v); dn.style.left = l + '%'; dn.style.width = `max(2px, calc(${z - l}% - 1px))`; bar.appendChild(dn); }
        if (v > maxUp){ const cap = el('div', 'cap', '▸'); cap.style.right = '-11px'; bar.appendChild(cap); }
        if (-v > maxDn){ const cap = el('div', 'cap', '◂'); cap.style.left = '-11px'; bar.appendChild(cap); }
        row.appendChild(bar);
        const val = el('div', 'v ' + (v >= 0 ? 'pos' : 'neg'), sgn(v));
        val.title = `flagged at $${x.preMarketPrice.toFixed(2)} · high $${x.performance.high.toFixed(2)}`;
        row.appendChild(val);
      } else {
        row.appendChild(el('div', 'pend', day.source === 'live' ? 'scored after the close' : 'no session data'));
      }
      mount.appendChild(row);
    }
  }
}

render();
renderHistory();
if (!document.getElementById('hist-sec').hidden) panel('tog-history', 'history', 'scs-panel-history');

/**
 * Keep the page current on its own.
 *
 * With no app in the loop, an open tab is the live view — so it reloads itself
 * every three minutes, but only while a scan could plausibly have produced
 * something new. Reloading all evening would be pointless traffic, and worse,
 * it would make a stale page look freshly checked.
 */
(function autoRefresh(){
  const etNow = new Date(new Date().toLocaleString('en-US', { timeZone: 'America/New_York' }));
  const day = etNow.getDay();
  const mins = etNow.getHours() * 60 + etNow.getMinutes();
  const scanning = day >= 1 && day <= 5 && mins >= 4 * 60 && mins <= 11 * 60 + 30;
  if (!scanning) return;
  setTimeout(() => location.reload(), 180000);

  // Show how old the figures are, counting up, so a frozen page is obvious.
  const age = document.getElementById('age');
  if (!age) return;
  const t0 = Date.parse(D && D.generatedAt ? D.generatedAt : Date.now());
  (function tick(){
    const m = Math.max(0, Math.round((Date.now() - t0) / 60000));
    age.textContent = `· ${m} min ago · refreshing`;
    setTimeout(tick, 20000);
  })();
})();
</script>
