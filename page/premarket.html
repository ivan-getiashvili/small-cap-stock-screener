<title>Pre-Market Shortlist</title>
<style>
  :root{
    --bg:#0b0e13; --panel:#12161e; --panel2:#171c26; --line:#232a36;
    --ink:#e9edf5; --dim:#98a3b6; --faint:#66718a;
    --go:#3fd07f; --go-bg:rgba(63,208,127,.10); --warn:#f0b849; --no:#5b6474; --hot:#ff6b6b;
    --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 var(--sans);-webkit-font-smoothing:antialiased}
  .wrap{max-width:940px;margin:0 auto;padding:26px 18px 70px}
  a{color:#7fb2ff}

  header{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-start;justify-content:space-between;margin-bottom:20px}
  h1{margin:0;font-size:23px;font-weight:650;letter-spacing:-.02em}
  .sub{color:var(--faint);font-size:13px;margin-top:3px}
  .status{text-align:right;font:12px/1.6 var(--mono);color:var(--dim)}
  .pill{display:inline-block;padding:3px 10px;border-radius:99px;font:11px/1.6 var(--mono);
        text-transform:uppercase;letter-spacing:.07em}
  .pill.live{background:var(--go-bg);color:var(--go)}
  .pill.shut{background:#222835;color:var(--faint)}

  .banner{border-radius:10px;padding:14px 16px;margin-bottom:22px;font-size:13.5px;line-height:1.6}
  .banner.wait{background:rgba(240,184,73,.08);border:1px solid rgba(240,184,73,.25);color:#e8c37a}
  .banner.none{background:var(--panel);border:1px solid var(--line);color:var(--dim)}
  .banner.demo{background:rgba(99,162,255,.08);border:1px solid rgba(99,162,255,.3);color:#a9c9ff}

  h2{font-size:12px;text-transform:uppercase;letter-spacing:.09em;color:var(--dim);margin:28px 0 12px;font-weight:650}
  h2 em{font-style:normal;color:var(--faint);text-transform:none;letter-spacing:0;font-weight:400}

  /* The shortlist is the product; the watchlist is context. The page should
     make that obvious before a single number is read. */
  .primary{margin-bottom:8px}
  .primary h2{font-size:15px;color:var(--go);letter-spacing:.04em;text-transform:none;margin-bottom:4px}
  .primary .lede{color:var(--dim);font-size:13px;margin-bottom:16px}
  .rank{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;
        border-radius:7px;background:var(--go);color:#08130c;font:700 13px/1 var(--mono);margin-right:9px}

  .divider{display:flex;align-items:center;gap:14px;margin:40px 0 18px}
  .divider::before,.divider::after{content:'';flex:1;height:1px;background:var(--line)}
  .divider span{color:var(--faint);font:11px/1 var(--mono);text-transform:uppercase;letter-spacing:.12em;white-space:nowrap}

  /* Demoted: compact rows, muted, no card chrome. */
  .secondary{opacity:.72}
  .secondary:hover{opacity:1}
  .secondary h2{color:var(--faint)}
  .mini{display:grid;grid-template-columns:auto 1fr auto auto;gap:10px;align-items:center;
        padding:10px 13px;border:1px solid var(--line);border-radius:9px;background:var(--panel);margin-bottom:7px}
  .mini .mt{font:650 15px/1.2 var(--mono)}
  .mini .mn{color:var(--faint);font-size:11.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .mini .mc{font:650 14px/1.2 var(--mono);color:var(--go)}
  .mini .mf{font:11.5px/1.3 var(--mono);color:var(--dim);text-align:right}
  .mini .miss{display:block;color:var(--warn);font-size:10.5px}

  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:12px}
  .card.top{border-color:rgba(63,208,127,.35);box-shadow:0 0 0 1px rgba(63,208,127,.08) inset}
  .row1{display:flex;flex-wrap:wrap;gap:12px;align-items:baseline;justify-content:space-between}
  .tick{font:650 21px/1.2 var(--mono);letter-spacing:.01em}
  .co{color:var(--faint);font-size:12.5px;max-width:340px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .chg{font:650 21px/1.2 var(--mono);color:var(--go)}
  .chg.big{color:var(--hot)}
  .px{font:13px/1.2 var(--mono);color:var(--dim)}

  .nums{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:1px;background:var(--line);
        border:1px solid var(--line);border-radius:8px;overflow:hidden;margin:13px 0}
  .nums div{background:var(--panel2);padding:8px 10px}
  .nums b{display:block;font:600 15px/1.3 var(--mono)}
  .nums small{color:var(--faint);font-size:10.5px;text-transform:uppercase;letter-spacing:.05em}

  .why{margin:11px 0 0;font-size:13px;color:var(--ink);background:rgba(63,208,127,.06);
       border:1px solid rgba(63,208,127,.18);border-radius:8px;padding:9px 12px}
  .why b{font-family:var(--mono);font-weight:650}
  .nums b.go{color:var(--go)} .nums b.hot{color:var(--hot)} .nums b.warn{color:var(--warn)}
  .checks{display:flex;flex-wrap:wrap;gap:6px;margin-top:11px}
  .chk{font:11.5px/1.7 var(--sans);padding:2px 9px;border-radius:6px;background:#222835;color:var(--no)}
  .chk.ok{background:var(--go-bg);color:var(--go)}
  .biz{color:var(--dim);font-size:12px;margin-top:2px}
  .ext{margin-top:9px;font-size:12.5px;line-height:1.55;color:#e8c37a;
       background:rgba(240,184,73,.07);border:1px solid rgba(240,184,73,.25);border-radius:8px;padding:9px 12px}
  .ext b{color:#f0b849}
  .cat{margin-top:11px;font-size:13px;color:var(--dim);border-left:2px solid var(--line);padding-left:11px}
  .cat b{color:var(--ink)}

  footer{margin-top:38px;padding-top:18px;border-top:1px solid var(--line);font-size:12.5px;line-height:1.7;color:var(--faint)}
  footer b{color:var(--dim)}

  /* ---- Track record ---------------------------------------------------------
     Up/down marks use the validated diverging pair (blue/red dark steps, CVD
     dE 19.2). The page's own green/red failed deuteranopia at dE 4.4, so they
     are not used for marks here; position on the axis and signed numbers carry
     the direction as well, so colour is never the only channel. */
  .hist{margin-top:44px}
  .hist h2{font-size:15px;color:var(--ink);letter-spacing:.02em;text-transform:none;margin-bottom:4px}
  .hist .lede{color:var(--dim);font-size:13px;margin-bottom:16px}
  .tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:1px;background:var(--line);
         border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:18px}
  .tiles div{background:var(--panel);padding:12px 14px}
  .tiles b{display:block;font:600 22px/1.2 var(--sans)}
  .tiles small{color:var(--faint);font-size:11px}
  .keyrow{display:flex;flex-wrap:wrap;gap:16px;align-items:center;color:var(--dim);font-size:12px;margin:0 0 12px}
  .keyrow i{display:inline-block;vertical-align:middle;margin-right:6px}
  .sw{width:14px;height:8px;border-radius:2px}
  .dotkey{width:10px;height:10px;border-radius:50%;background:var(--ink);box-shadow:0 0 0 2px var(--panel)}
  .hday{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:12px}
  .hday-h{display:flex;gap:10px;align-items:baseline;justify-content:space-between;margin-bottom:6px}
  .hday-h b{font:600 14px/1.3 var(--sans)}
  .hday-h span{color:var(--faint);font:11px/1.3 var(--mono)}
  .src{padding:1px 7px;border-radius:99px;font:10.5px/1.6 var(--mono);text-transform:uppercase;letter-spacing:.06em;
       background:#222835;color:var(--dim)}
  .hrow{display:grid;grid-template-columns:minmax(120px,1.3fr) minmax(90px,.8fr) minmax(160px,2.2fr) repeat(3,minmax(62px,.55fr));
        gap:10px;align-items:center;padding:8px 2px;border-top:1px solid var(--line);font-size:12.5px;outline:none}
  .hrow:first-of-type{border-top:0}
  .hrow.watch{opacity:.62}
  .hrow:hover,.hrow:focus-visible{background:var(--panel2);opacity:1}
  .hrow .tk{font:650 14px/1.2 var(--mono)}
  .hrow .bz{color:var(--faint);font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .hrow .fl{color:var(--dim);font:12px/1.3 var(--mono)}
  .hrow .v{font:12.5px/1.2 var(--mono);text-align:right;font-variant-numeric:tabular-nums;color:var(--ink)}
  .hrow .v small{display:block;color:var(--faint);font:10px/1.3 var(--sans)}
  .hcols{border-top:0;color:var(--faint);font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;padding-top:2px}
  .hcols .v{color:var(--faint);font:10.5px/1.2 var(--sans)}
  .rng{position:relative;height:20px;margin:0 12px}
  .rng .zero{position:absolute;top:1px;bottom:1px;width:1px;background:#3a4252}
  .rng .up,.rng .dn{position:absolute;top:6px;height:8px}
  .rng .up{background:#3987e5;border-radius:0 4px 4px 0}
  .rng .dn{background:#e66767;border-radius:4px 0 0 4px}
  .rng .cl{position:absolute;top:4px;width:12px;height:12px;margin-left:-6px;border-radius:50%;
           box-shadow:0 0 0 2px var(--panel)}
  .hrow:hover .rng .cl{box-shadow:0 0 0 2px var(--panel2)}
  .rng .cap{position:absolute;top:3px;font:10px/1 var(--mono);color:var(--faint)}
  .pend{color:var(--faint);font-size:11.5px}
  .axis{position:relative;height:14px;color:var(--faint);font:10px/1 var(--mono)}
  .axis span{position:absolute;transform:translateX(-50%);white-space:nowrap}
  .tip{position:fixed;z-index:20;pointer-events:none;background:#1b212c;border:1px solid var(--line);border-radius:8px;
       padding:9px 11px;font:12px/1.5 var(--sans);color:var(--dim);box-shadow:0 6px 24px rgba(0,0,0,.45);max-width:260px}
  .tip b{color:var(--ink);font:600 13px/1.4 var(--mono)}
  .tip .r{display:flex;justify-content:space-between;gap:14px}
  .tip .r span:last-child{color:var(--ink);font-family:var(--mono)}
  /* Narrow screens: name, flag and range bar each take a full line, and the
     three results sit in their own labelled columns. The first version squeezed
     six columns into two, and at 375px the numbers ran off the card and were
     clipped — a value cut off by its own layout is worse than no value. */
  @media(max-width:720px){
    .hrow{grid-template-columns:repeat(3,minmax(0,1fr));row-gap:6px;column-gap:8px;padding:10px 2px}
    .hrow>div:nth-child(1),.hrow>div:nth-child(2),.hrow .rngcell{grid-column:1/-1}
    .hrow .v{text-align:left}
    .hrow .v::before{content:attr(data-label);display:block;color:var(--faint);
                     font:10px/1.4 var(--sans);text-transform:uppercase;letter-spacing:.04em}
    .hcols{display:none}
    .hday-h{flex-wrap:wrap}
    .floating-note{position:static!important;display:block;margin:10px 18px!important;max-width:none!important}
  }
</style>

<div class="wrap">
  <header>
    <div>
      <h1>Pre-Market Shortlist</h1>
      <div class="sub">Small-cap gappers screened on five momentum criteria, before the bell.</div>
    </div>
    <div class="status" id="status"></div>
  </header>

  <div id="banner"></div>
  <div id="shortlist"></div>
  <div id="watchlist"></div>
  <div id="history"></div>
  <footer id="foot"></footer>
</div>

<script>
const D = /*__PREMARKET__*/null;
const H = /*__HISTORY__*/null;

const f = {
  usd: n => '$' + Number(n).toFixed(2),
  pct: n => (n >= 0 ? '+' : '') + Number(n).toFixed(1) + '%',
  sh:  n => n == null ? '—' : n >= 1e9 ? (n/1e9).toFixed(2)+'B' : n >= 1e6 ? (n/1e6).toFixed(1)+'M'
        : n >= 1e3 ? (n/1e3).toFixed(0)+'K' : String(n),
  mult: n => n == null ? '—' : Number(n).toFixed(1) + '×',
  time: iso => new Date(iso).toLocaleString(undefined, {dateStyle:'medium', timeStyle:'short'}),
};

function mini(r){
  const failed = (r.checks||[]).filter(c => !c.ok).map(c => c.name);
  return `<div class="mini">
    <span class="mt">${r.symbol}</span>
    <span class="mn">${r.legalName||r.name||''}${r.business? ' · '+r.business : ''}</span>
    <span class="mc">${f.pct(r.preMarketChangePct)}</span>
    <span class="mf">${f.usd(r.preMarketPrice)} · ${f.sh(r.preMarketVolume)} sh
      ${failed.length? `<span class="miss">missing: ${failed.join(', ')}</span>`:''}</span>
  </div>`;
}

function card(r, top, rank){
  const nums = [
    [f.pct(r.preMarketChangePct), 'pre-market move', r.preMarketChangePct >= 20 ? 'hot' : 'go'],
    [f.mult(r.relVolume), 'rel volume', (r.relVolume||0) >= 5 ? 'go' : ''],
    [f.sh(r.preMarketVolume), 'pre-mkt shares', (r.preMarketVolume||0) >= 150000 ? 'go' : ''],
    [r.preMarketDollarVolume ? '$' + f.sh(r.preMarketDollarVolume) : '—', 'pre-mkt $ traded', ''],
    [r.float ? f.sh(r.float.shares) : '—', 'float', r.float && r.float.shares < 10e6 ? 'go' : ''],
    [r.floatPctOfShares != null ? r.floatPctOfShares.toFixed(0) + '%' : '—', 'float / shares out', ''],
    [f.mult(r.floatRotation), 'float rotation', (r.floatRotation||0) >= 1 ? 'go' : ''],
    [r.marketCap ? '$' + f.sh(r.marketCap) : '—', 'market cap', ''],
    [r.daysUp != null ? 'day ' + (r.daysUp + 1) : '—', 'of the run', r.extended ? 'warn' : 'go'],
  ].map(([v,l,c]) => `<div><b class="${c||''}">${v}</b><small>${l}</small></div>`).join('');

  // The one-line case for looking at this stock at all.
  const why = [];
  if (r.relVolume != null)
    why.push(`trading <b>${f.mult(r.relVolume)}</b> a normal full day's volume before the open`);
  if (r.floatRotation != null && r.floatRotation >= 0.5)
    why.push(`already turned over <b>${f.mult(r.floatRotation)}</b> its float`);
  else if (r.float)
    why.push(`only <b>${f.sh(r.float.shares)}</b> shares available to trade`);
  if (r.bestPriorSpikePct != null && r.bestPriorSpikePct >= 20)
    why.push(`has run <b>+${r.bestPriorSpikePct.toFixed(0)}%</b> in a day before`);
  if (r.preMarketHigh && r.preMarketLow)
    why.push(`pre-market range <b>${f.usd(r.preMarketLow)}–${f.usd(r.preMarketHigh)}</b>`);

  return `<div class="card ${top?'top':''}">
    <div class="row1">
      <div>
        ${rank ? `<span class="rank">${rank}</span>` : ''}<span class="tick">${r.symbol}</span>
        <div class="co" title="${(r.legalName||r.name||'').replace(/"/g,'&quot;')}">${r.legalName||r.name||''}</div>
        ${r.business ? `<div class="biz">${r.business}</div>` : ''}
      </div>
      <div style="text-align:right">
        <div class="chg ${r.preMarketChangePct>=50?'big':''}">${f.pct(r.preMarketChangePct)}</div>
        <div class="px">${f.usd(r.preMarketPrice)} &nbsp;<span style="color:var(--faint)">prev ${r.prevClose?f.usd(r.prevClose):'—'}</span></div>
      </div>
    </div>

    ${why.length ? `<div class="why">Why it is here: ${why.join(' · ')}.</div>` : ''}
    ${r.extended ? `<div class="ext"><b>Already extended.</b>
      ${r.daysUp >= 2 ? `Day ${r.daysUp + 1} of an up-run` : 'Has run hard into today'}${
        r.priorRunPct != null ? `, up ${r.priorRunPct >= 0 ? '+' : ''}${r.priorRunPct.toFixed(0)}% over the last few sessions before this morning` : ''
      }. Multi-day runners are usually squeezes that have already happened — the fresh day-one move is the one worth having.</div>` : ''}

    <div class="nums">${nums}</div>

    <div class="checks">${r.checks.map(c =>
      `<span class="chk ${c.ok?'ok':''}">${c.ok?'✓':'✕'} ${c.name} · ${c.detail}</span>`).join('')}</div>

    ${r.catalyst && r.catalyst.found
      ? `<div class="cat">
           <b>${r.catalyst.subject || (r.catalyst.kind === '8-K' ? 'SEC filing' : 'News')}</b>
           <span style="color:var(--faint)">· ${r.catalyst.kind === '8-K' ? 'SEC 8-K' : 'headline'} ${r.catalyst.date||''}</span>
           ${r.catalyst.headline && r.catalyst.headline !== r.catalyst.subject
              ? `<div style="margin-top:3px">${r.catalyst.headline}</div>` : ''}
         </div>`
      : `<div class="cat">No catalyst found — the move has no visible reason behind it.</div>`}
    ${r.float && r.float.basis !== 'sec-public-float'
      ? `<div class="cat" style="border-color:rgba(240,184,73,.45)">Float shown is <b>shares outstanding</b>, an upper bound — the true tradable float is smaller, so rotation is understated.</div>`
      : r.float ? `<div class="cat" style="color:var(--faint)">Float filed with the SEC ${r.float.asOf}. Annual figure — check it before sizing.</div>` : ''}
  </div>`;
}

function render(){
  if (!D){ document.getElementById('banner').innerHTML =
    '<div class="banner none">No scan has run yet.</div>'; return; }

  const open = /pre[\s-]?market/i.test(D.marketStatus||'');
  document.getElementById('status').innerHTML =
    `<span class="pill ${open?'live':'shut'}">${D.marketStatus||'unknown'}</span><br>` +
    `scanned ${f.time(D.generatedAt)}<br>${D.universeChecked.toLocaleString()} symbols scanned` +
    (D.investigated ? `<br>${D.investigated.toLocaleString()} movers investigated` : '') +
    (D.fetch && D.fetch.requested ? `<br>${D.fetch.answerRatePct.toFixed(0)}% of quotes answered` : '');

  const b = document.getElementById('banner');
  if (D.isDemo){
    document.getElementById('banner').innerHTML =
      `<div class="banner demo"><b>This is a replay, not today's list.</b>
       Every number below is the real pre-market state of a real stock on
       <b>${D.demoDate}</b>, frozen at <b>${D.snapshotAtEt} ET</b> — the moment the live scan runs.
       Nothing here is invented. It exists so you can see the shape of the product before a live
       session fills it in. Catalysts are not re-checked in a replay.</div>`;
    document.getElementById('shortlist').innerHTML = D.shortlist.length
    ? `<div class="primary"><h2>Trade candidates — ${D.shortlist.length} name${D.shortlist.length>1?'s':''}</h2>
       <div class="lede">These met every criterion. This is the list; everything below the line is context.</div></div>`
      + D.shortlist.map((r,i) => card(r, true, i+1)).join('')
    : '';
    document.getElementById('watchlist').innerHTML = D.watchlist.length
    ? `<div class="divider"><span>below the line — not trade candidates</span></div>
       <div class="secondary"><h2>Watchlist <em>— four of five, the missing one is named</em></h2>`
      + D.watchlist.map(r => mini(r)).join('') + `</div>`
    : '';
    foot(); return;
  }
  // A broken feed looks exactly like a quiet market — an empty list either way.
  // Say which one it is rather than let silence imply "nothing qualified".
  if (D.fetch && !D.fetch.reliable){
    b.innerHTML = `<div class="banner wait"><b>This scan is unreliable.</b>
      Only ${D.fetch.answerRatePct.toFixed(0)}% of quote requests answered
      (${D.fetch.answered.toLocaleString()} of ${D.fetch.requested.toLocaleString()}),
      so an empty shortlist below may mean the data feed failed rather than that nothing qualified.
      Do not read this as "no opportunities today".</div>`;
  } else if (D.liveQuotes === 0){
    b.innerHTML = `<div class="banner wait"><b>No live pre-market quotes.</b>
      Nasdaq reports the market as “${D.marketStatus||'unknown'}”, so there are no pre-market prices to read.
      This page fills in once the pre-market session is running — it opens at 4:00 AM ET and this scan is
      meant to run around 8:45. Prices below the fold, if any, are from the previous session
      (${D.prevSession||'—'}).</div>`;
  } else if (!D.shortlist.length){
    b.innerHTML = `<div class="banner none"><b>Nothing cleared all five criteria today.</b>
      ${D.liveQuotes.toLocaleString()} stocks had live pre-market prices. That is a normal outcome —
      A full scan usually leaves fewer than ten names, and some mornings none at all.
      Trading nothing is a position.</div>`;
  } else { b.innerHTML = ''; }

  document.getElementById('shortlist').innerHTML = D.shortlist.length
    ? `<div class="primary"><h2>Trade candidates — ${D.shortlist.length} name${D.shortlist.length>1?'s':''}</h2>
       <div class="lede">These met every criterion. This is the list; everything below the line is context.</div></div>`
      + D.shortlist.map((r,i) => card(r, true, i+1)).join('')
    : '';
  document.getElementById('watchlist').innerHTML = D.watchlist.length
    ? `<div class="divider"><span>below the line — not trade candidates</span></div>
       <div class="secondary"><h2>Watchlist <em>— four of five, the missing one is named</em></h2>`
      + D.watchlist.map(r => mini(r)).join('') + `</div>`
    : '';


  foot();
}

function foot(){
  const g = D.gate;
  document.getElementById('foot').innerHTML = `
    <b>The five criteria.</b> Up ≥${g.minPreMarketChangePct}% pre-market ·
    pre-market volume ≥${(g.minPreMarketVolume/1000)}k ·
    a real news catalyst · price $${g.priceMin}–$${g.priceMax} ·
    float under ${g.floatIdeal/1e6}M shares. All five must pass to reach the shortlist.
    <br><br>
    <b>Quality tiers.</b> Float under 20M with pre-market volume over 150k is high quality;
    pre-market volume under 50k is low. Percent gainers are ranked first, then catalyst and float,
    ending with a handful of names rather than twenty.
    <br><br>
    <b>Fresh moves only.</b> The percentage is this session against the previous close, not a
    multi-day total. A name that has already climbed for several sessions is marked
    <b>extended</b> — a stock up 100% in one morning on new information is the setup; one up 100%
    over three sessions is usually a squeeze that has already happened.
    <br><br>
    <b>What this is not.</b> It finds candidates; it does not decide anything. Entry, size and stop are
    yours. Float is the weakest number here — SEC files it once a year and small caps dilute constantly,
    so anything marked estimated should be checked before you size a position.
    <br><br>
    Sources: Nasdaq public quote and screener endpoints, SEC EDGAR for float, share count and 8-K
    filings. Data may be delayed. Not investment advice.`;
}
/**
 * Desktop push, straight from the page — no app, no account, no key.
 *
 * The browser's own Notification API fires a real OS notification. The one
 * limitation is honest and unavoidable: it needs this page open in a tab,
 * because a static site has no server to push from. Keep it pinned during
 * pre-market and it behaves like any other alerting app.
 *
 * It only fires for names it has not already told you about — the page reloads
 * every three minutes, and re-announcing the same three tickers twenty times a
 * morning would be worse than silence.
 */
(function desktopPush(){
  if (!('Notification' in window) || !D || D.isDemo) return;

  const KEY = 'scs-announced';
  const readSeen = () => { try { return JSON.parse(localStorage.getItem(KEY) || '{}'); } catch { return {}; } };
  const writeSeen = (v) => { try { localStorage.setItem(KEY, JSON.stringify(v)); } catch {} };

  function announce(){
    if (Notification.permission !== 'granted') return;
    const today = (D.prevSession || new Date().toISOString().slice(0,10));
    const seen = readSeen();
    const already = seen.date === today ? (seen.symbols || []) : [];
    const fresh = (D.shortlist || []).filter(r => !already.includes(r.symbol));
    if (!fresh.length) return;

    const line = fresh.map(r =>
      `${r.symbol}  ${r.preMarketChangePct >= 0 ? '+' : ''}${r.preMarketChangePct.toFixed(0)}%` +
      (r.relVolume ? `  ${r.relVolume.toFixed(1)}x vol` : '')).join('\n');
    const n = new Notification(
      fresh.length === 1 ? `${fresh[0].symbol} cleared all five` : `${fresh.length} on the shortlist`,
      { body: line, tag: 'scs-shortlist', requireInteraction: true },
    );
    n.onclick = () => { window.focus(); n.close(); };
    writeSeen({ date: today, symbols: [...already, ...fresh.map(r => r.symbol)] });
  }

  // A small, honest control rather than an unprompted permission popup.
  const bar = document.createElement('div');
  bar.className = 'floating-note';
  bar.style.cssText = 'position:fixed;bottom:12px;left:14px;font:11.5px/1.3 var(--sans);' +
    'color:var(--dim);background:var(--panel);border:1px solid var(--line);' +
    'padding:8px 12px;border-radius:10px;cursor:pointer;max-width:250px';
  function paint(){
    if (Notification.permission === 'granted'){
      bar.innerHTML = '<b style="color:var(--go)">✓ Desktop alerts on</b><br>' +
        '<span style="color:var(--faint)">Keep this tab open during pre-market.</span>';
      bar.style.cursor = 'default';
    } else if (Notification.permission === 'denied'){
      bar.innerHTML = '<b style="color:var(--warn)">Alerts blocked</b><br>' +
        '<span style="color:var(--faint)">Allow notifications for this site in your browser settings.</span>';
      bar.style.cursor = 'default';
    } else {
      bar.innerHTML = '<b>Turn on desktop alerts</b><br>' +
        '<span style="color:var(--faint)">Click here — no app, no signup.</span>';
    }
  }
  bar.onclick = () => {
    if (Notification.permission === 'default')
      Notification.requestPermission().then(() => { paint(); announce(); });
  };
  paint();
  document.body.appendChild(bar);
  announce();
})();

/**
 * Track record: what every flagged name actually did in the session it was
 * flagged for. Losers are shown exactly like winners.
 *
 * Built with createElement/textContent throughout: company names and business
 * descriptions come from outside sources and must never be parsed as HTML.
 */
function renderHistory(){
  const mount = document.getElementById('history');
  if (!mount || !H || !H.days || (D && D.isDemo)) return;
  const days = Object.values(H.days).filter(d => d.names && d.names.length)
    .sort((a, b) => b.date.localeCompare(a.date));
  if (!days.length) return;

  const el = (tag, cls, text) => { const n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; };
  const sgn = v => (v >= 0 ? '+' : '−') + Math.abs(v).toFixed(Math.abs(v) >= 100 ? 0 : 1) + '%';
  const med = a => { if (!a.length) return null; const s = [...a].sort((x, y) => x - y), m = s.length >> 1; return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2; };
  const dayLabel = iso => new Date(iso + 'T12:00:00Z').toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric', timeZone: 'UTC' });

  const shortScored = days.flatMap(d => d.names).filter(n => n.list === 'shortlist' && n.performance);
  const allScored = days.flatMap(d => d.names).filter(n => n.performance);

  // A shared scale for every row, so bars compare across days — set by where
  // most rows sit, not by the single most extreme one. The first version scaled
  // to the maximum: one +221% session set the axis and a normal ±15% day shrank
  // to a few pixels. The 90th percentile sets it now; anything beyond is drawn
  // to the edge with an arrow, and its exact value stays in the columns.
  const q = (arr, p) => { if (!arr.length) return 0; const s = [...arr].sort((a, b) => a - b); return s[Math.min(s.length - 1, Math.floor(p * (s.length - 1)))]; };
  const maxUp = Math.max(20, Math.ceil(q(allScored.map(n => n.performance.openToHighPct), 0.9) / 5) * 5);
  const maxDn = Math.max(10, Math.ceil(q(allScored.map(n => -n.performance.openToLowPct), 0.9) / 5) * 5);
  const beyondScale = allScored.filter(n => n.performance.openToHighPct > maxUp || -n.performance.openToLowPct > maxDn).length;
  const span = maxUp + maxDn;
  const pos = v => ((Math.max(-maxDn, Math.min(maxUp, v)) + maxDn) / span) * 100;

  const sec = el('section', 'hist');
  sec.appendChild(el('h2', null, 'Track record'));
  sec.appendChild(el('div', 'lede',
    'How every flagged name traded in the regular session it was flagged for, scored after the close. ' +
    'Nothing is filtered out: names that faded are listed exactly like names that ran.'));

  // Headline numbers for trade candidates. Stat tiles, not a chart.
  if (shortScored.length){
    const oh = shortScored.map(n => n.performance.openToHighPct);
    const oc = shortScored.map(n => n.performance.openToClosePct);
    const tiles = el('div', 'tiles');
    const tile = (value, label) => { const t = el('div'); t.appendChild(el('b', null, value)); t.appendChild(el('small', null, label)); tiles.appendChild(t); };
    tile(String(shortScored.length), `trade candidates scored, over ${new Set(shortScored.map(n => n.firstSeenAt.slice(0,10))).size} session${shortScored.length === 1 ? '' : 's'}`);
    tile(sgn(med(oh)), 'median open → high');
    tile(`${Math.round(100 * oh.filter(v => v >= 20).length / oh.length)}%`, `ran 20%+ above the open (${oh.filter(v => v >= 20).length} of ${oh.length})`);
    tile(sgn(med(oc)), 'median open → close');
    tile(`${Math.round(100 * oc.filter(v => v > 0).length / oc.length)}%`, `closed above the open (${oc.filter(v => v > 0).length} of ${oc.length})`);
    sec.appendChild(tiles);
  }

  // Legend: two colours on the page, so a legend is always present.
  const key = el('div', 'keyrow');
  const k = (swatchCls, style, label) => { const s = el('span'); const i = el('i', swatchCls); if (style) i.style.background = style; s.appendChild(i); s.appendChild(document.createTextNode(label)); key.appendChild(s); };
  k('sw', '#3987e5', 'range above the open');
  k('sw', '#e66767', 'range below the open');
  k('dotkey', null, 'where it closed');
  k('', null, `scale −${maxDn}% to +${maxUp}% from the open${beyondScale ? ` · ${beyondScale} larger move${beyondScale > 1 ? 's' : ''} run off the edge (◂ ▸)` : ''}`);
  sec.appendChild(key);

  const tip = el('div', 'tip'); tip.hidden = true; document.body.appendChild(tip);
  const showTip = (n, x, y) => {
    const p = n.performance;
    tip.replaceChildren();
    tip.appendChild(el('b', null, n.symbol));
    const r = (a, b) => { const row = el('div', 'r'); row.appendChild(el('span', null, a)); row.appendChild(el('span', null, b)); tip.appendChild(row); };
    r('flagged pre-market', `${sgn(n.preMarketChangePct)} at $${n.preMarketPrice.toFixed(2)}`);
    if (p){
      r('open', `$${p.open.toFixed(2)}${p.gapPct != null ? ` (gap ${sgn(p.gapPct)})` : ''}`);
      r('high', `$${p.high.toFixed(2)}  ${sgn(p.openToHighPct)}`);
      r('low', `$${p.low.toFixed(2)}  ${sgn(p.openToLowPct)}`);
      r('close', `$${p.close.toFixed(2)}  ${sgn(p.openToClosePct)}`);
      if (p.volume) r('volume', Math.round(p.volume).toLocaleString());
    } else r('session', 'scored after the close');
    if (n.catalyst) r('catalyst', n.catalyst);
    tip.hidden = false;
    const w = tip.offsetWidth, hgt = tip.offsetHeight;
    tip.style.left = Math.min(window.innerWidth - w - 10, x + 14) + 'px';
    tip.style.top = Math.min(window.innerHeight - hgt - 10, y + 14) + 'px';
  };

  const cols = () => {
    const c = el('div', 'hrow hcols');
    ['name', 'flagged', 'session range'].forEach(t => c.appendChild(el('div', null, t)));
    ['open→high', 'open→close', 'open→low'].forEach(t => c.appendChild(el('div', 'v', t)));
    return c;
  };

  for (const day of days){
    const box = el('div', 'hday');
    const head = el('div', 'hday-h');
    const left = el('b', null, dayLabel(day.date));
    const scored = day.names.filter(n => n.performance).length;
    head.appendChild(left);
    const meta = el('span', null, `${day.names.filter(n => n.list === 'shortlist').length} candidate(s) · ${day.names.filter(n => n.list === 'watchlist').length} watchlist · ${scored}/${day.names.length} scored `);
    const badge = el('span', 'src', day.source === 'replay' ? 'replay' : 'live');
    meta.appendChild(badge);
    head.appendChild(meta);
    box.appendChild(head);
    box.appendChild(cols());

    const ordered = [...day.names].sort((a, b) =>
      (a.list === b.list ? 0 : a.list === 'shortlist' ? -1 : 1) || b.preMarketChangePct - a.preMarketChangePct);

    for (const n of ordered){
      const p = n.performance;
      const row = el('div', 'hrow' + (n.list === 'watchlist' ? ' watch' : ''));
      row.tabIndex = 0;

      const nameCell = el('div');
      nameCell.appendChild(el('div', 'tk', n.symbol + (n.list === 'watchlist' ? '  · 4/5' : '')));
      nameCell.appendChild(el('div', 'bz', [n.legalName, n.business].filter(Boolean).join(' · ')));
      row.appendChild(nameCell);

      row.appendChild(el('div', 'fl', `${sgn(n.preMarketChangePct)} @ $${n.preMarketPrice.toFixed(2)}`));

      const rc = el('div', 'rngcell');
      if (p){
        const rng = el('div', 'rng');
        rng.setAttribute('role', 'img');
        rng.setAttribute('aria-label', `${n.symbol}: high ${sgn(p.openToHighPct)}, low ${sgn(p.openToLowPct)}, close ${sgn(p.openToClosePct)} from the open`);
        const z = pos(0);
        const zero = el('div', 'zero'); zero.style.left = z + '%'; rng.appendChild(zero);
        if (p.openToHighPct > 0){
          const up = el('div', 'up');
          // 1px surface gap either side of the open line separates the two fills.
          up.style.left = `calc(${z}% + 1px)`; up.style.width = `max(0px, calc(${pos(p.openToHighPct) - z}% - 1px))`;
          rng.appendChild(up);
        }
        if (p.openToLowPct < 0){
          const dn = el('div', 'dn');
          const l = pos(p.openToLowPct);
          dn.style.left = l + '%'; dn.style.width = `max(0px, calc(${z - l}% - 1px))`;
          rng.appendChild(dn);
        }
        const cl = el('div', 'cl');
        cl.style.left = pos(p.openToClosePct) + '%';
        cl.style.background = p.openToClosePct >= 0 ? '#3987e5' : '#e66767';
        rng.appendChild(cl);
        if (p.openToHighPct > maxUp){ const cap = el('div', 'cap', '▸'); cap.style.right = '-11px'; rng.appendChild(cap); }
        if (-p.openToLowPct > maxDn){ const cap = el('div', 'cap', '◂'); cap.style.left = '-11px'; rng.appendChild(cap); }
        rc.appendChild(rng);
      } else {
        rc.appendChild(el('div', 'pend', day.source === 'live' ? 'scored after the close' : 'no session data'));
      }
      row.appendChild(rc);

      const val = (label, v, sub) => { const c = el('div', 'v', v == null ? '—' : sgn(v)); c.dataset.label = label; if (sub) c.appendChild(el('small', null, sub)); return c; };
      row.appendChild(val('open→high', p ? p.openToHighPct : null, p ? `$${p.high.toFixed(2)}` : null));
      row.appendChild(val('open→close', p ? p.openToClosePct : null, p ? `$${p.close.toFixed(2)}` : null));
      row.appendChild(val('open→low', p ? p.openToLowPct : null, p ? `$${p.low.toFixed(2)}` : null));

      row.addEventListener('pointermove', e => showTip(n, e.clientX, e.clientY));
      row.addEventListener('pointerleave', () => { tip.hidden = true; });
      row.addEventListener('focus', () => { const b = row.getBoundingClientRect(); showTip(n, b.left + b.width / 2, b.bottom); });
      row.addEventListener('blur', () => { tip.hidden = true; });
      box.appendChild(row);
    }
    sec.appendChild(box);
  }
  mount.replaceChildren(sec);
}

render();
renderHistory();

/**
 * Keep the page current on its own.
 *
 * With no app in the loop, an open tab is the live view — so it reloads itself
 * every three minutes, but only while a scan could plausibly have produced
 * something new. Reloading all evening would be pointless traffic, and worse,
 * it would make a stale page look freshly checked.
 */
(function autoRefresh(){
  const etNow = new Date(new Date().toLocaleString('en-US', { timeZone: 'America/New_York' }));
  const day = etNow.getDay();
  const mins = etNow.getHours() * 60 + etNow.getMinutes();
  const scanning = day >= 1 && day <= 5 && mins >= 4 * 60 && mins <= 11 * 60 + 30;
  if (!scanning) return;
  setTimeout(() => location.reload(), 180000);

  // Show how old the figures are, counting up, so a frozen page is obvious.
  const el = document.createElement('div');
  el.className = 'floating-note';
  el.style.cssText = 'position:fixed;bottom:12px;right:14px;font:11px/1 var(--mono);' +
    'color:var(--faint);background:var(--panel);border:1px solid var(--line);' +
    'padding:6px 10px;border-radius:99px';
  document.body.appendChild(el);
  const t0 = Date.parse(D && D.generatedAt ? D.generatedAt : Date.now());
  (function tick(){
    const age = Math.max(0, Math.round((Date.now() - t0) / 60000));
    el.textContent = `scanned ${age} min ago · refreshing`;
    setTimeout(tick, 20000);
  })();
})();
</script>
