<title>Pre-Market Shortlist</title>
<style>
  :root{
    --bg:#0b0e13; --panel:#12161e; --panel2:#171c26; --line:#232a36;
    --ink:#e9edf5; --dim:#98a3b6; --faint:#66718a;
    --go:#3fd07f; --go-bg:rgba(63,208,127,.10); --warn:#f0b849; --no:#5b6474; --hot:#ff6b6b;
    --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 var(--sans);-webkit-font-smoothing:antialiased}
  .wrap{max-width:940px;margin:0 auto;padding:26px 18px 70px}
  a{color:#7fb2ff}

  header{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-start;justify-content:space-between;margin-bottom:20px}
  h1{margin:0;font-size:23px;font-weight:650;letter-spacing:-.02em}
  .sub{color:var(--faint);font-size:13px;margin-top:3px}
  .status{text-align:right;font:12px/1.6 var(--mono);color:var(--dim)}
  .pill{display:inline-block;padding:3px 10px;border-radius:99px;font:11px/1.6 var(--mono);
        text-transform:uppercase;letter-spacing:.07em}
  .pill.live{background:var(--go-bg);color:var(--go)}
  .pill.shut{background:#222835;color:var(--faint)}

  .banner{border-radius:10px;padding:14px 16px;margin-bottom:22px;font-size:13.5px;line-height:1.6}
  .banner.wait{background:rgba(240,184,73,.08);border:1px solid rgba(240,184,73,.25);color:#e8c37a}
  .banner.none{background:var(--panel);border:1px solid var(--line);color:var(--dim)}
  .banner.demo{background:rgba(99,162,255,.08);border:1px solid rgba(99,162,255,.3);color:#a9c9ff}

  h2{font-size:12px;text-transform:uppercase;letter-spacing:.09em;color:var(--dim);margin:28px 0 12px;font-weight:650}
  h2 em{font-style:normal;color:var(--faint);text-transform:none;letter-spacing:0;font-weight:400}

  /* The shortlist is the product; the watchlist is context. The page should
     make that obvious before a single number is read. */
  .primary{margin-bottom:8px}
  .primary h2{font-size:15px;color:var(--go);letter-spacing:.04em;text-transform:none;margin-bottom:4px}
  .primary .lede{color:var(--dim);font-size:13px;margin-bottom:16px}
  .rank{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;
        border-radius:7px;background:var(--go);color:#08130c;font:700 13px/1 var(--mono);margin-right:9px}

  .divider{display:flex;align-items:center;gap:14px;margin:40px 0 18px}
  .divider::before,.divider::after{content:'';flex:1;height:1px;background:var(--line)}
  .divider span{color:var(--faint);font:11px/1 var(--mono);text-transform:uppercase;letter-spacing:.12em;white-space:nowrap}

  /* Demoted: compact rows, muted, no card chrome. */
  .secondary{opacity:.72}
  .secondary:hover{opacity:1}
  .secondary h2{color:var(--faint)}
  .mini{display:grid;grid-template-columns:auto 1fr auto auto;gap:10px;align-items:center;
        padding:10px 13px;border:1px solid var(--line);border-radius:9px;background:var(--panel);margin-bottom:7px}
  .mini .mt{font:650 15px/1.2 var(--mono)}
  .mini .mn{color:var(--faint);font-size:11.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .mini .mc{font:650 14px/1.2 var(--mono);color:var(--go)}
  .mini .mf{font:11.5px/1.3 var(--mono);color:var(--dim);text-align:right}
  .mini .miss{display:block;color:var(--warn);font-size:10.5px}

  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:12px}
  .card.top{border-color:rgba(63,208,127,.35);box-shadow:0 0 0 1px rgba(63,208,127,.08) inset}
  .row1{display:flex;flex-wrap:wrap;gap:12px;align-items:baseline;justify-content:space-between}
  .tick{font:650 21px/1.2 var(--mono);letter-spacing:.01em}
  .co{color:var(--faint);font-size:12.5px;max-width:340px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .chg{font:650 21px/1.2 var(--mono);color:var(--go)}
  .chg.big{color:var(--hot)}
  .px{font:13px/1.2 var(--mono);color:var(--dim)}

  .nums{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:1px;background:var(--line);
        border:1px solid var(--line);border-radius:8px;overflow:hidden;margin:13px 0}
  .nums div{background:var(--panel2);padding:8px 10px}
  .nums b{display:block;font:600 15px/1.3 var(--mono)}
  .nums small{color:var(--faint);font-size:10.5px;text-transform:uppercase;letter-spacing:.05em}

  .why{margin:11px 0 0;font-size:13px;color:var(--ink);background:rgba(63,208,127,.06);
       border:1px solid rgba(63,208,127,.18);border-radius:8px;padding:9px 12px}
  .why b{font-family:var(--mono);font-weight:650}
  .nums b.go{color:var(--go)} .nums b.hot{color:var(--hot)} .nums b.warn{color:var(--warn)}
  .checks{display:flex;flex-wrap:wrap;gap:6px;margin-top:11px}
  .chk{font:11.5px/1.7 var(--sans);padding:2px 9px;border-radius:6px;background:#222835;color:var(--no)}
  .chk.ok{background:var(--go-bg);color:var(--go)}
  .biz{color:var(--dim);font-size:12px;margin-top:2px}
  .ext{margin-top:9px;font-size:12.5px;line-height:1.55;color:#e8c37a;
       background:rgba(240,184,73,.07);border:1px solid rgba(240,184,73,.25);border-radius:8px;padding:9px 12px}
  .ext b{color:#f0b849}
  .cat{margin-top:11px;font-size:13px;color:var(--dim);border-left:2px solid var(--line);padding-left:11px}
  .cat b{color:var(--ink)}

  footer{margin-top:38px;padding-top:18px;border-top:1px solid var(--line);font-size:12.5px;line-height:1.7;color:var(--faint)}
  footer b{color:var(--dim)}
</style>

<div class="wrap">
  <header>
    <div>
      <h1>Pre-Market Shortlist</h1>
      <div class="sub">Small-cap gappers screened on five momentum criteria, before the bell.</div>
    </div>
    <div class="status" id="status"></div>
  </header>

  <div id="banner"></div>
  <div id="shortlist"></div>
  <div id="watchlist"></div>
  <footer id="foot"></footer>
</div>

<script>
const D = /*__PREMARKET__*/null;

const f = {
  usd: n => '$' + Number(n).toFixed(2),
  pct: n => (n >= 0 ? '+' : '') + Number(n).toFixed(1) + '%',
  sh:  n => n == null ? '—' : n >= 1e9 ? (n/1e9).toFixed(2)+'B' : n >= 1e6 ? (n/1e6).toFixed(1)+'M'
        : n >= 1e3 ? (n/1e3).toFixed(0)+'K' : String(n),
  mult: n => n == null ? '—' : Number(n).toFixed(1) + '×',
  time: iso => new Date(iso).toLocaleString(undefined, {dateStyle:'medium', timeStyle:'short'}),
};

function mini(r){
  const failed = (r.checks||[]).filter(c => !c.ok).map(c => c.name);
  return `<div class="mini">
    <span class="mt">${r.symbol}</span>
    <span class="mn">${r.legalName||r.name||''}${r.business? ' · '+r.business : ''}</span>
    <span class="mc">${f.pct(r.preMarketChangePct)}</span>
    <span class="mf">${f.usd(r.preMarketPrice)} · ${f.sh(r.preMarketVolume)} sh
      ${failed.length? `<span class="miss">missing: ${failed.join(', ')}</span>`:''}</span>
  </div>`;
}

function card(r, top, rank){
  const nums = [
    [f.pct(r.preMarketChangePct), 'pre-market move', r.preMarketChangePct >= 20 ? 'hot' : 'go'],
    [f.mult(r.relVolume), 'rel volume', (r.relVolume||0) >= 5 ? 'go' : ''],
    [f.sh(r.preMarketVolume), 'pre-mkt shares', (r.preMarketVolume||0) >= 150000 ? 'go' : ''],
    [r.preMarketDollarVolume ? '$' + f.sh(r.preMarketDollarVolume) : '—', 'pre-mkt $ traded', ''],
    [r.float ? f.sh(r.float.shares) : '—', 'float', r.float && r.float.shares < 10e6 ? 'go' : ''],
    [r.floatPctOfShares != null ? r.floatPctOfShares.toFixed(0) + '%' : '—', 'float / shares out', ''],
    [f.mult(r.floatRotation), 'float rotation', (r.floatRotation||0) >= 1 ? 'go' : ''],
    [r.marketCap ? '$' + f.sh(r.marketCap) : '—', 'market cap', ''],
    [r.daysUp != null ? 'day ' + (r.daysUp + 1) : '—', 'of the run', r.extended ? 'warn' : 'go'],
  ].map(([v,l,c]) => `<div><b class="${c||''}">${v}</b><small>${l}</small></div>`).join('');

  // The one-line case for looking at this stock at all.
  const why = [];
  if (r.relVolume != null)
    why.push(`trading <b>${f.mult(r.relVolume)}</b> a normal full day's volume before the open`);
  if (r.floatRotation != null && r.floatRotation >= 0.5)
    why.push(`already turned over <b>${f.mult(r.floatRotation)}</b> its float`);
  else if (r.float)
    why.push(`only <b>${f.sh(r.float.shares)}</b> shares available to trade`);
  if (r.bestPriorSpikePct != null && r.bestPriorSpikePct >= 20)
    why.push(`has run <b>+${r.bestPriorSpikePct.toFixed(0)}%</b> in a day before`);
  if (r.preMarketHigh && r.preMarketLow)
    why.push(`pre-market range <b>${f.usd(r.preMarketLow)}–${f.usd(r.preMarketHigh)}</b>`);

  return `<div class="card ${top?'top':''}">
    <div class="row1">
      <div>
        ${rank ? `<span class="rank">${rank}</span>` : ''}<span class="tick">${r.symbol}</span>
        <div class="co" title="${(r.legalName||r.name||'').replace(/"/g,'&quot;')}">${r.legalName||r.name||''}</div>
        ${r.business ? `<div class="biz">${r.business}</div>` : ''}
      </div>
      <div style="text-align:right">
        <div class="chg ${r.preMarketChangePct>=50?'big':''}">${f.pct(r.preMarketChangePct)}</div>
        <div class="px">${f.usd(r.preMarketPrice)} &nbsp;<span style="color:var(--faint)">prev ${r.prevClose?f.usd(r.prevClose):'—'}</span></div>
      </div>
    </div>

    ${why.length ? `<div class="why">Why it is here: ${why.join(' · ')}.</div>` : ''}
    ${r.extended ? `<div class="ext"><b>Already extended.</b>
      ${r.daysUp >= 2 ? `Day ${r.daysUp + 1} of an up-run` : 'Has run hard into today'}${
        r.priorRunPct != null ? `, up ${r.priorRunPct >= 0 ? '+' : ''}${r.priorRunPct.toFixed(0)}% over the last few sessions before this morning` : ''
      }. Multi-day runners are usually squeezes that have already happened — the fresh day-one move is the one worth having.</div>` : ''}

    <div class="nums">${nums}</div>

    <div class="checks">${r.checks.map(c =>
      `<span class="chk ${c.ok?'ok':''}">${c.ok?'✓':'✕'} ${c.name} · ${c.detail}</span>`).join('')}</div>

    ${r.catalyst && r.catalyst.found
      ? `<div class="cat">
           <b>${r.catalyst.subject || (r.catalyst.kind === '8-K' ? 'SEC filing' : 'News')}</b>
           <span style="color:var(--faint)">· ${r.catalyst.kind === '8-K' ? 'SEC 8-K' : 'headline'} ${r.catalyst.date||''}</span>
           ${r.catalyst.headline && r.catalyst.headline !== r.catalyst.subject
              ? `<div style="margin-top:3px">${r.catalyst.headline}</div>` : ''}
         </div>`
      : `<div class="cat">No catalyst found — the move has no visible reason behind it.</div>`}
    ${r.float && r.float.basis !== 'sec-public-float'
      ? `<div class="cat" style="border-color:rgba(240,184,73,.45)">Float shown is <b>shares outstanding</b>, an upper bound — the true tradable float is smaller, so rotation is understated.</div>`
      : r.float ? `<div class="cat" style="color:var(--faint)">Float filed with the SEC ${r.float.asOf}. Annual figure — check it before sizing.</div>` : ''}
  </div>`;
}

function render(){
  if (!D){ document.getElementById('banner').innerHTML =
    '<div class="banner none">No scan has run yet.</div>'; return; }

  const open = /pre-market/i.test(D.marketStatus||'');
  document.getElementById('status').innerHTML =
    `<span class="pill ${open?'live':'shut'}">${D.marketStatus||'unknown'}</span><br>` +
    `scanned ${f.time(D.generatedAt)}<br>${D.universeChecked.toLocaleString()} symbols scanned` +
    (D.investigated ? `<br>${D.investigated.toLocaleString()} movers investigated` : '') +
    (D.fetch && D.fetch.requested ? `<br>${D.fetch.answerRatePct.toFixed(0)}% of quotes answered` : '');

  const b = document.getElementById('banner');
  if (D.isDemo){
    document.getElementById('banner').innerHTML =
      `<div class="banner demo"><b>This is a replay, not today's list.</b>
       Every number below is the real pre-market state of a real stock on
       <b>${D.demoDate}</b>, frozen at <b>${D.snapshotAtEt} ET</b> — the moment the live scan runs.
       Nothing here is invented. It exists so you can see the shape of the product before a live
       session fills it in. Catalysts are not re-checked in a replay.</div>`;
    document.getElementById('shortlist').innerHTML = D.shortlist.length
    ? `<div class="primary"><h2>Trade candidates — ${D.shortlist.length} name${D.shortlist.length>1?'s':''}</h2>
       <div class="lede">These met every criterion. This is the list; everything below the line is context.</div></div>`
      + D.shortlist.map((r,i) => card(r, true, i+1)).join('')
    : '';
    document.getElementById('watchlist').innerHTML = D.watchlist.length
    ? `<div class="divider"><span>below the line — not trade candidates</span></div>
       <div class="secondary"><h2>Watchlist <em>— four of five, the missing one is named</em></h2>`
      + D.watchlist.map(r => mini(r)).join('') + `</div>`
    : '';
    foot(); return;
  }
  // A broken feed looks exactly like a quiet market — an empty list either way.
  // Say which one it is rather than let silence imply "nothing qualified".
  if (D.fetch && !D.fetch.reliable){
    b.innerHTML = `<div class="banner wait"><b>This scan is unreliable.</b>
      Only ${D.fetch.answerRatePct.toFixed(0)}% of quote requests answered
      (${D.fetch.answered.toLocaleString()} of ${D.fetch.requested.toLocaleString()}),
      so an empty shortlist below may mean the data feed failed rather than that nothing qualified.
      Do not read this as "no opportunities today".</div>`;
  } else if (D.liveQuotes === 0){
    b.innerHTML = `<div class="banner wait"><b>No live pre-market quotes.</b>
      Nasdaq reports the market as “${D.marketStatus||'unknown'}”, so there are no pre-market prices to read.
      This page fills in once the pre-market session is running — it opens at 4:00 AM ET and this scan is
      meant to run around 8:45. Prices below the fold, if any, are from the previous session
      (${D.prevSession||'—'}).</div>`;
  } else if (!D.shortlist.length){
    b.innerHTML = `<div class="banner none"><b>Nothing cleared all five criteria today.</b>
      ${D.liveQuotes.toLocaleString()} stocks had live pre-market prices. That is a normal outcome —
      A full scan usually leaves fewer than ten names, and some mornings none at all.
      Trading nothing is a position.</div>`;
  } else { b.innerHTML = ''; }

  document.getElementById('shortlist').innerHTML = D.shortlist.length
    ? `<div class="primary"><h2>Trade candidates — ${D.shortlist.length} name${D.shortlist.length>1?'s':''}</h2>
       <div class="lede">These met every criterion. This is the list; everything below the line is context.</div></div>`
      + D.shortlist.map((r,i) => card(r, true, i+1)).join('')
    : '';
  document.getElementById('watchlist').innerHTML = D.watchlist.length
    ? `<div class="divider"><span>below the line — not trade candidates</span></div>
       <div class="secondary"><h2>Watchlist <em>— four of five, the missing one is named</em></h2>`
      + D.watchlist.map(r => mini(r)).join('') + `</div>`
    : '';


  foot();
}

function foot(){
  const g = D.gate;
  document.getElementById('foot').innerHTML = `
    <b>The five criteria.</b> Up ≥${g.minPreMarketChangePct}% pre-market ·
    pre-market volume ≥${(g.minPreMarketVolume/1000)}k ·
    a real news catalyst · price $${g.priceMin}–$${g.priceMax} ·
    float under ${g.floatIdeal/1e6}M shares. All five must pass to reach the shortlist.
    <br><br>
    <b>Quality tiers.</b> Float under 20M with pre-market volume over 150k is high quality;
    pre-market volume under 50k is low. Percent gainers are ranked first, then catalyst and float,
    ending with a handful of names rather than twenty.
    <br><br>
    <b>Fresh moves only.</b> The percentage is this session against the previous close, not a
    multi-day total. A name that has already climbed for several sessions is marked
    <b>extended</b> — a stock up 100% in one morning on new information is the setup; one up 100%
    over three sessions is usually a squeeze that has already happened.
    <br><br>
    <b>What this is not.</b> It finds candidates; it does not decide anything. Entry, size and stop are
    yours. Float is the weakest number here — SEC files it once a year and small caps dilute constantly,
    so anything marked estimated should be checked before you size a position.
    <br><br>
    Sources: Nasdaq public quote and screener endpoints, SEC EDGAR for float, share count and 8-K
    filings. Data may be delayed. Not investment advice.`;
}
render();

/**
 * Keep the page current on its own.
 *
 * With no app in the loop, an open tab is the live view — so it reloads itself
 * every three minutes, but only while a scan could plausibly have produced
 * something new. Reloading all evening would be pointless traffic, and worse,
 * it would make a stale page look freshly checked.
 */
(function autoRefresh(){
  const etNow = new Date(new Date().toLocaleString('en-US', { timeZone: 'America/New_York' }));
  const day = etNow.getDay();
  const mins = etNow.getHours() * 60 + etNow.getMinutes();
  const scanning = day >= 1 && day <= 5 && mins >= 4 * 60 && mins <= 11 * 60 + 30;
  if (!scanning) return;
  setTimeout(() => location.reload(), 180000);

  // Show how old the figures are, counting up, so a frozen page is obvious.
  const el = document.createElement('div');
  el.style.cssText = 'position:fixed;bottom:12px;right:14px;font:11px/1 var(--mono);' +
    'color:var(--faint);background:var(--panel);border:1px solid var(--line);' +
    'padding:6px 10px;border-radius:99px';
  document.body.appendChild(el);
  const t0 = Date.parse(D && D.generatedAt ? D.generatedAt : Date.now());
  (function tick(){
    const age = Math.max(0, Math.round((Date.now() - t0) / 60000));
    el.textContent = `scanned ${age} min ago · refreshing`;
    setTimeout(tick, 20000);
  })();
})();
</script>
