name: Pre-market shortlist

# The scan is only meaningful while the pre-market session is running (04:00–09:30 ET).
# GitHub cron is UTC and its schedules drift by several minutes under load, so rather
# than aim at one exact moment we sweep the window every 20 minutes. That also covers
# both halves of the year without editing anything: 11:00–14:59 UTC is 07:00–10:59 ET
# in summer (EDT) and 06:00–09:59 ET in winter (EST). Each run overwrites the page, so
# the site always shows the most recent scan.
on:
  schedule:
    - cron: '0,20,40 11-14 * * 1-5'   # pre-market sweep
    - cron: '0 15 * * 1-5'            # backstop: guarantees the daily wrap-up posts
    - cron: '10 21 * * 1-5'           # after the close: record today's closes
  workflow_dispatch:        # lets you trigger a scan by hand any time
    inputs:
      mode:
        description: 'scan (default) or snapshot (record closing prices)'
        required: false
        default: scan
        type: choice
        options: [scan, snapshot]

permissions:
  contents: write        # the post-close job commits data/prevclose.json
  issues: write          # the shortlist is delivered as an issue comment
  pages: write
  id-token: write

# Never let two scans publish at once; a later one is always the one we want.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      # After the close we only record closing prices; tomorrow's scan needs them
      # to measure a pre-market move rather than trust a vendor's change field.
      - name: Record today's closes
        if: github.event.schedule == '10 21 * * 1-5' || inputs.mode == 'snapshot'
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: |
          npm run snapshot
          # Score today's shortlist on the session it was flagged for.
          npm run history:fill
          git config user.name  "premarket-bot"
          git config user.email "noreply@github.com"
          # closes.json is the rolling window behind the "already extended" flag.
          # It used to be updated here and never committed, so it never rolled.
          git add data/prevclose.json data/closes.json data/closes.meta.json data/history.json
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git commit -m "Record closes and score history for $(date -u +%Y-%m-%d)"
          for i in 1 2 3; do git pull --rebase -q origin main && git push -q origin HEAD:main && exit 0; sleep 5; done
          echo "::error::could not push closes and history"; exit 1

      - name: Scan the pre-market
        if: github.event.schedule != '10 21 * * 1-5' && inputs.mode != 'snapshot'
        env:
          # EDGAR returns 403 without a contact string in the User-Agent.
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: npm run premarket

      # Each CI run starts from a clean checkout, so anything not committed is
      # gone by the next one. The scan keeps this morning's list after the bell,
      # and history accumulates across days, only because both are committed here.
      - name: Save the scan and history
        if: github.event.schedule != '10 21 * * 1-5' && inputs.mode != 'snapshot'
        run: |
          git config user.name  "premarket-bot"
          git config user.email "noreply@github.com"
          git add data/premarket.json data/history.json
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git commit -q -m "Scan $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do git pull --rebase -q origin main && git push -q origin HEAD:main && exit 0; sleep 5; done
          echo "::warning::could not push the scan state"

      - name: Build the pages
        if: github.event.schedule != '10 21 * * 1-5' && inputs.mode != 'snapshot'
        run: |
          npm run build:premarket
          # The replay demo is static; rebuild it so the deployed site always
          # carries a worked example next to the live list.
          if [ -f data/demo.json ]; then npm run build:demo; fi
          # The research page is static output; publish it alongside if its
          # data is present, so the analysis is reachable from the same site.
          if [ -f data/screen.json ]; then npm run build:research; fi

      - name: Check the page is not empty
        if: github.event.schedule != '10 21 * * 1-5' && inputs.mode != 'snapshot'
        # A green workflow is not evidence the page is good. If the build produced
        # a stub, fail here rather than publish a blank site over a working one.
        run: |
          test -s _site/index.html
          bytes=$(wc -c < _site/index.html)
          echo "index.html is $bytes bytes"
          if [ "$bytes" -lt 3000 ]; then
            echo "::error::index.html is suspiciously small — refusing to publish"
            exit 1
          fi
          grep -q "Pre-Market Shortlist" _site/index.html

      - name: Show what was found
        if: github.event.schedule != '10 21 * * 1-5' && inputs.mode != 'snapshot'
        run: |
          node -e "
            const d=require('./data/premarket.json');
            console.log('market:', d.marketStatus, '| live quotes:', d.liveQuotes);
            if (d.fetch) {
              console.log('quotes answered:', d.fetch.answered + '/' + d.fetch.requested,
                          '(' + d.fetch.answerRatePct.toFixed(0) + '%)');
              // Fail loudly on a broken feed during pre-market. Silently
              // publishing an empty list would look like a quiet morning.
              if (!d.fetch.reliable && /pre[\s-]?market/i.test(d.marketStatus||'')) {
                console.log('::error::feed answered only ' + d.fetch.answerRatePct.toFixed(0) + '% during pre-market');
                process.exit(1);
              }
            }
            console.log('shortlist:', d.shortlist.map(r=>r.symbol+' '+r.preMarketChangePct.toFixed(0)+'%').join(', ')||'(none)');
            console.log('watchlist:', d.watchlist.map(r=>r.symbol).join(', ')||'(none)');
          "

      # Push goes to Telegram when configured. The GitHub comment is only the
      # fallback, because its delivery mechanism is email.
      - name: Send the shortlist (Telegram push, else GitHub comment)
        if: github.event.schedule != '10 21 * * 1-5' && inputs.mode != 'snapshot'
        env:
          # Telegram takes over as soon as these two secrets exist; until then
          # the GitHub comment (and its email) is the fallback.
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          NOTIFY_ISSUE: '2'
          SITE_URL: https://ivan-getiashvili.github.io/small-cap-stock-screener/
        run: npm run notify

      - name: Persist the one-shot reminder flag
        if: github.event.schedule != '10 21 * * 1-5' && inputs.mode != 'snapshot'
        continue-on-error: true
        run: |
          if [ -f data/reminders.json ] && ! git diff --quiet data/reminders.json 2>/dev/null; then
            git config user.name  "premarket-bot"
            git config user.email "noreply@github.com"
            git add data/reminders.json
            git commit -m "Reminder fired" && git push
          fi

      - name: Deploy to Cloudflare
        # Optional. Runs only once CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID
        # exist as repository secrets; until then the site is served by Pages.
        if: >-
          github.event.schedule != '10 21 * * 1-5' && inputs.mode != 'snapshot'
          && env.CF_TOKEN != ''
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@latest deploy

      # Always keep the built page as a downloadable artifact, whatever the
      # hosting situation is. This is the fallback that cannot fail.
      # Skipped in snapshot mode, where no page is built at all.
      - uses: actions/upload-artifact@v4
        if: github.event.schedule != '10 21 * * 1-5' && inputs.mode != 'snapshot'
        with:
          name: site
          path: _site
          retention-days: 7

      - uses: actions/upload-pages-artifact@v3
        if: github.event.schedule != '10 21 * * 1-5' && inputs.mode != 'snapshot'
        with:
          path: _site

  publish:
    needs: scan
    if: github.event.schedule != '10 21 * * 1-5' && inputs.mode != 'snapshot'
    runs-on: ubuntu-latest
    # GitHub Pages is unavailable for private repositories on the free plan, so
    # a failure here must not red the whole run — the scan above is the part
    # that matters, and its artifact is still produced. Once the repo is public
    # (or Pages is otherwise enabled) this step starts succeeding on its own.
    continue-on-error: true
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
